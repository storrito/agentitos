# Every skill's tests on every push and pull request: .github/run-tests.mjs finds them
# (<skill>/tools/test*.mjs), so a new skill's tests run without a change here. The layout skill's
# tests start Chrome and take the longest: they run in a job of their own, beside the others.
# No secret is used and none is needed: no test may call a model or the network.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: "How many times the layout skill's tests run one after the other (to catch one that fails now and then)"
        type: number
        default: 1
      break-cache:
        description: "Make one cached package unreadable, to see the install fall back to Ubuntu's mirrors"
        type: boolean
        default: false

permissions:
  contents: read

# (bash with pipefail: a pipe's failure fails the step, not only its last command's)
defaults:
  run:
    shell: bash

env:
  # Ubuntu's packages the tests need, installed by .github/debs.sh and kept in one cache entry
  # that both jobs share
  DEBS: ffmpeg fonts-noto-core

concurrency:
  # (a manual run is a group of its own: a push does not cancel it)
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skills (all but layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # captions' tests build the version of an older commit to compare with
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      # Ubuntu's ffmpeg (6.1.1) and Noto Sans (the font the layout skill's pages measure with):
      # the packages are kept in GitHub's cache under the Ubuntu release and the list of packages
      # (not the image's build, of which GitHub hands out several at once); .github/debs.sh says
      # why that is safe and what happens when a set no longer fits
      - id: debs
        run: echo "key=debs-$ImageOS-$(printf %s "$DEBS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/debs
          key: ${{ steps.debs.outputs.key }}
          restore-keys: ${{ steps.debs.outputs.key }}-
      - name: ffmpeg and fonts
        id: install
        timeout-minutes: 15
        env:
          DEBS_BREAK: ${{ inputs.break-cache && '1' || '' }}
        run: .github/debs.sh
      # a set made anew is kept under a key of its own; a restore takes the newest
      - if: steps.install.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/debs
          key: ${{ steps.debs.outputs.key }}-${{ github.run_id }}-${{ github.job }}
      - name: tests
        run: node .github/run-tests.mjs --install --except layout --jobs 3

  layout:
    name: layout (with Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Ubuntu's ffmpeg (6.1.1) and Noto Sans (the font the layout skill's pages measure with):
      # the packages are kept in GitHub's cache under the Ubuntu release and the list of packages
      # (not the image's build, of which GitHub hands out several at once); .github/debs.sh says
      # why that is safe and what happens when a set no longer fits
      - id: debs
        run: echo "key=debs-$ImageOS-$(printf %s "$DEBS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/debs
          key: ${{ steps.debs.outputs.key }}
          restore-keys: ${{ steps.debs.outputs.key }}-
      - name: ffmpeg and fonts
        id: install
        timeout-minutes: 15
        env:
          DEBS_BREAK: ${{ inputs.break-cache && '1' || '' }}
        run: .github/debs.sh
      # a set made anew is kept under a key of its own; a restore takes the newest
      - if: steps.install.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/debs
          key: ${{ steps.debs.outputs.key }}-${{ github.run_id }}-${{ github.job }}
      - name: tests
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          # the runner's own Chrome, as layout/tools/lib/zones.mjs reads it
          export CHROME="$(command -v google-chrome || command -v chromium)"
          case "$REPEAT" in ''|*[!0-9]*) echo "repeat is a whole number"; exit 1;; esac
          failed=0
          for i in $(seq "$REPEAT"); do
            [ "$REPEAT" -gt 1 ] && echo "::notice::layout run $i of $REPEAT"
            node .github/run-tests.mjs layout || failed=$((failed + 1))
          done
          [ "$REPEAT" -gt 1 ] && echo "::notice::$failed of $REPEAT runs failed"
          exit $(( failed > 0 ))
