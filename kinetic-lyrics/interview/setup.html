<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short einrichten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Instrument+Serif:ital@0;1&display=swap">
<!--
  The setup of one kinetic short (see SKILL.md, "Setting it up together").
  The person sets everything here at once; choosing, moving on and
  changing happen in the page, without the agent. The agent only gets
  real work: the clip (as soon as a source is chosen, while the person
  goes on) and one "build the preview" with all settings. Once the short
  is built, the page changes it itself: the player shows a change at once
  (the composition's "kinetic-settings" event), and the skill's action
  "apply" (actions.json), which pchat runs, builds it in, without the
  agent; what the short has then comes from its composition/settings.json.
  The agent edits only the JSON in <script id="state">; the choices not
  yet applied wait in this browser (localStorage) across reloads.
-->
<script type="application/json" id="state">
{
  "lang": "de",
  "phase": "setup",
  "answers": {
    "quelle": null,
    "welt": null,
    "format": null,
    "titel": null,
    "sprecher": null,
    "farben": null,
    "abspann": null,
    "posten": null
  },
  "video": null,
  "speakers": null,
  "accounts": [],
  "project": null,
  "note": ""
}
</script>
<style>
  :root { --bg: #f4f2ee; --card: #fff; --text: #1c1c1e; --muted: #6c6c70; --line: #e0ddd6; --accent: #ff5a36; --accent-ink: #fff;
          --done: #1f9d55; --soft: #faf8f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1f1f22; --text: #f2f2f2; --muted: #a1a1a6; --line: #333338; --done: #3ccf7a; --soft: #19191b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 40px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  .layout { display: grid; gap: 20px; max-width: 980px; margin: 0 auto; }
  @media (min-width: 720px) { .layout { grid-template-columns: minmax(220px, 300px) 1fr; align-items: start; }
                              .preview-wrap { position: sticky; top: 16px; } }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }

  /* the preview */
  .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .frame { position: relative; width: 100%; max-width: 280px; border-radius: 18px; overflow: hidden; background: #2a2a2e;
           box-shadow: 0 10px 30px rgba(0,0,0,.25); aspect-ratio: 9 / 16; transition: aspect-ratio .25s; }
  @media (max-width: 719px) { .frame { max-width: 150px; } .frame .words .big { font-size: 26px; } .frame .words .big i { font-size: 25px; } .frame .top { font-size: 7px; } }
  .frame > * { position: absolute; inset: 0; }
  .frame .bg { transition: background .3s; }
  .frame .clip { background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px); }
  .frame .clip span { position: absolute; top: 18%; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.6); font-size: 12px; }
  .frame .shade { background: linear-gradient(transparent 45%, rgba(0,0,0,.65) 62%); }
  .frame .top { inset: 7% 0 auto; text-align: center; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 9px;
                letter-spacing: .14em; text-transform: uppercase; color: var(--ink, #faf7f0); opacity: .85; }
  .frame .top em { display: block; font-family: "Instrument Serif", serif; letter-spacing: 0; text-transform: none; font-size: 13px; opacity: .8; }
  .frame .words { inset: auto 14% 24% 8%; color: var(--ink, #faf7f0); }
  .frame .chip { display: inline-block; font-family: "League Gothic", sans-serif; font-size: 13px; letter-spacing: .03em;
                 padding: 1px 8px; border-radius: 4px; background: var(--wacc, #ffd27a); color: #111; margin-bottom: 6px; }
  .frame .big { font-family: "League Gothic", sans-serif; font-size: 46px; line-height: .92; text-transform: uppercase; }
  .frame .big i { font-family: "Instrument Serif", serif; font-style: italic; text-transform: none; color: var(--wacc, #ffd27a); font-size: 44px; }
  .frame .cta { inset: auto 0 7%; text-align: center; }
  .frame .cta span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; font-weight: 700; padding: 4px 10px;
                     border-radius: 20px; background: var(--wacc, #ffd27a); color: #0b0812; }
  .frame .empty { display: grid; place-items: center; color: rgba(255,255,255,.55); font-size: 13px; text-align: center; padding: 20px; }
  .frame hyperframes-player { display: block; width: 100%; height: 100%; }
  .frame .wake { display: grid; place-items: center; align-content: center; gap: 10px; background: #222; color: #fff; text-align: center; padding: 16px; font-size: 13px; }
  .caption { color: var(--muted); font-size: 12px; text-align: center; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 280px; }
  .actions > * { flex: 1 1 auto; text-align: center; }

  /* the steps */
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .step.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; background: none; border: none; border-radius: 14px;
          cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .head:hover .edit { text-decoration: underline; text-underline-offset: 3px; }
  .step.open .head { cursor: default; }
  .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600;
         background: var(--line); flex: none; }
  .step.done .num { background: var(--done); color: #fff; }
  .step.open .num { background: var(--accent); color: #fff; }
  .step.pending .num { background: transparent; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .label { font-weight: 600; flex: none; }
  .value { margin-left: auto; color: var(--muted); text-align: right; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .edit { flex: none; font-size: 12px; color: var(--accent); }
  .body { padding: 0 14px 14px 46px; }
  @media (max-width: 480px) { .body { padding-left: 14px; } }
  .question { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .note { margin: 0 0 10px; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--soft); }
  .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .row input[type=text] { flex: 1 1 160px; min-width: 0; }
  input[type=text] { font: inherit; color: inherit; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button, .button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
           border-radius: 10px; padding: 8px 12px; transition: transform .1s, border-color .1s; text-decoration: none; display: inline-block; }
  button:hover, .button:hover { border-color: var(--accent); }
  button:active, .button:active { transform: scale(.97); }
  button.chosen { box-shadow: 0 0 0 2px var(--accent) inset; border-color: var(--accent); }
  button.primary, .button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .world { width: 98px; height: 66px; padding: 6px 8px; display: flex; align-items: flex-end; color: #fff; font-weight: 600;
           text-shadow: 0 1px 3px rgba(0,0,0,.7); border: none; }
  .world.light { color: #222; text-shadow: none; }
  .world.auto { color: var(--text); text-shadow: none; border: 1px dashed var(--muted); background: var(--soft); align-items: center; justify-content: center; }
  .shape { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 12px; min-width: 76px; }
  .shape i { display: block; border: 2px solid currentColor; border-radius: 3px; opacity: .7; }
  .shape small { color: var(--muted); font-size: 11px; }
  .acc { display: flex; align-items: center; gap: 8px; }
  .row.colors { align-items: center; }
  .row.colors .who { min-width: 90px; font-size: 14px; }
  .swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid var(--line); }
  .swatch.chosen { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
  .row.colors input[type=color] { width: 34px; height: 30px; padding: 0 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
  .dots { display: inline-flex; gap: 10px; }
  .dot-label { display: inline-flex; align-items: center; gap: 4px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .acc input { width: 16px; height: 16px; accent-color: var(--accent); }
  /* the bar that sends stays in sight while the person scrolls the steps */
  #finish { position: sticky; bottom: 0; z-index: 2; padding: 8px 0 4px; background: linear-gradient(transparent, var(--bg) 14px); }
  #finish:empty { padding: 0; }
  .finish { padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent); box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  .finish .summary { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .busy-bar { display: none; align-items: center; gap: 10px; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px;
              background: var(--card); border: 1px solid var(--accent); font-size: 14px; }
  body.busy .busy-bar { display: flex; }
  .spinner { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent);
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { margin-top: 10px; min-height: 1.2em; color: var(--muted); font-size: 13px; }
  #status.error { color: #d70015; }
</style>
</head>
<body>
<div class="layout">
  <div class="preview-wrap">
    <div class="frame" id="frame"></div>
    <div class="caption" id="caption"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="busy-bar" id="busy"><span class="spinner"></span><span id="busy-text"></span></div>
    <div class="steps" id="steps"></div>
    <div id="finish"></div>
    <div id="status"></div>
  </div>
</div>

<script>
  const server = JSON.parse(document.getElementById('state').textContent);
  server.answers = server.answers || {};
  const de = server.lang !== 'en';
  const t = (d, e) => de ? d : e;
  const KEYS = ['quelle', 'welt', 'format', 'titel', 'sprecher', 'farben', 'abspann', 'posten'];
  const LOCAL = KEYS.slice(1);

  // The worlds of the engine (README, "Worlds"): a hint of each, its accent,
  // and whether it is light (light worlds do not go over video).
  const WORLDS = {
    cosmos:    { bg: 'radial-gradient(circle at 70% 18%, #fff 0 1px, transparent 2px), radial-gradient(circle at 22% 40%, #fff 0 1px, transparent 2px), radial-gradient(ellipse at 40% 35%, #5b2a86, transparent 60%), linear-gradient(#070720, #1b1446)', acc: '#ffd27a', fits: t('Träume, große Gefühle', 'dreams, big feelings') },
    aurora:    { bg: 'linear-gradient(150deg, #00c9a7, #845ec2 50%, #ff6f91)', acc: '#fff3b0', fits: t('Motivation, Lifestyle', 'motivation, lifestyle') },
    bokeh:     { bg: 'radial-gradient(circle at 22% 22%, #ffcf8a 0 7%, transparent 8%), radial-gradient(circle at 72% 30%, #ff9a5a 0 9%, transparent 10%), radial-gradient(circle at 48% 12%, #ffd9a0 0 5%, transparent 6%), linear-gradient(#2a1208, #120806)', acc: '#ffb35a', fits: t('Menschen, Humor, Gesundheit', 'people, comedy, health') },
    neon:      { bg: 'repeating-linear-gradient(90deg, rgba(0,240,255,.35) 0 1px, transparent 1px 22px), linear-gradient(170deg, #0b0b2a, #3a0ca3 60%, #f72585)', acc: '#00f0ff', fits: t('Tech, Sport, Tempo', 'tech, sport, speed') },
    noir:      { bg: 'repeating-linear-gradient(160deg, rgba(255,255,255,.10) 0 9px, transparent 9px 18px), linear-gradient(#0c0c0c, #262626)', acc: '#e8d7a8', fits: t('Krimi, Geheimnisse', 'crime, secrets') },
    editorial: { bg: 'linear-gradient(#f3eee2, #e6dfcf)', acc: '#c2410c', light: true, fits: t('Business, Bildung', 'business, education') },
    geometry:  { bg: 'radial-gradient(circle at 30% 35%, #f6b26b 0 12%, transparent 13%), radial-gradient(circle at 72% 60%, #6fa8dc 0 15%, transparent 16%), linear-gradient(#f4f4f2, #dcdcd8)', acc: '#2563eb', light: true, fits: t('Produkt, Erklärvideo', 'product, explainer') }
  };
  const FORMATS = [['9:16', 'Reels, TikTok'], ['4:5', 'Feed'], ['1:1', t('Quadrat', 'Square')], ['16:9', 'YouTube']];
  const DEFAULTS = { welt: 'auto', format: '9:16', titel: '', sprecher: '', farben: 'auto', abspann: '', posten: 'download' };
  // a short built before there were colours has the world's
  if (server.project && server.answers.farben == null) server.answers.farben = 'auto';
  // Once the short is built, what it has comes from the short itself, the settings its
  // build kept (composition/settings.json), not from what the agent wrote here.
  function fromSettings({ settings: s = {}, world, speakers }) {
    const named = String(s.names || '').split(',').map((kv) => kv.split('=')).filter(([k, n]) => k && n).sort();
    return {
      welt: world || s.world || server.answers.welt,
      format: s.aspect || '9:16',
      titel: s.title ? (s.subtitle ? `${s.title} · ${s.subtitle}` : s.title) : '',
      sprecher: named.map(([, n]) => n.trim()).join(', '),
      farben: s.colors || 'auto',
      abspann: s.cta && s.handle ? `${s.cta} · ${s.handle}` : s.cta || s.handle || '',
      speakers: (speakers || []).length || null,
    };
  }
  function loadBuilt() {
    if (!server.project) return Promise.resolve();
    return fetch(ARTIFACTS + server.project + '/composition/settings.json', { cache: 'no-store' })
      .then((r) => r.ok ? r.json() : null).then((file) => {
        if (!file) return;
        const b = fromSettings(file);
        if (b.speakers) server.speakers = b.speakers;
        delete b.speakers;
        Object.assign(server.answers, b);
        for (const k of Object.keys(store.draft)) if (String(store.draft[k]) === String(server.answers[k])) delete store.draft[k];
        save();
      }).catch(() => {});
  }
  // the speakers' colours to pick from: light on the dark worlds, dark (≥ 4:1) on paper and studio
  const COLORS = {
    dark: ['#7fe3ff', '#ffb36b', '#c9a7ff', '#9dffb0', '#ff8fb1', '#ffe066', '#ffffff'],
    light: ['#08609c', '#b0400a', '#5d33c4', '#11703e', '#ad1452', '#7a5c00', '#1c1a17']
  };
  const parseColors = (v) => Object.fromEntries(String(v || '').split(',').map((kv) => kv.split('=').map((x) => x.trim())).filter(([k, c]) => k && /^#[0-9a-f]{3,8}$/i.test(c || '')));
  const joinColors = (m) => Object.entries(m).sort().map(([k, c]) => `${k}=${c}`).join(',');
  // relative luminance (WCAG): a colour for light type on a dark world, or dark on paper
  const luminance = (hex) => {
    const h = hex.replace('#', ''), f = h.length === 3 ? h.split('').map((x) => x + x).join('') : h.slice(0, 6);
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16) / 255).map((c) => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const unreadable = (hex, lightWorld) => lightWorld ? luminance(hex) > 0.3 : luminance(hex) < 0.12;

  const isNone = (v) => v != null && /^(|-|–|none|no|keine?r?|kein abspann|ohne( namen)?|no names|no title|no end card)$/i.test(String(v).trim());
  const isLater = (v) => /^(später|later)$/i.test(String(v || '').trim());
  const blank = (v) => v == null;

  // ---------------------------------------------------------------- state
  // server: what the agent wrote. draft: what the person set here and has
  // not sent. sent: what went out and the agent has not written back yet.
  // Shown is draft over sent over server.
  const storeKey = 'kinetic-setup:' + location.pathname;
  let store = {};
  try { store = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (e) { store = {}; }
  store.draft = store.draft || {};
  store.sent = store.sent || {};
  // the agent's word counts: a sent value it wrote back, any value for one
  // left to it ("auto"), or a sent value older than ten minutes
  // once it has built the preview (phase "preview"), its word counts for all that was sent
  for (const k of Object.keys(store.sent)) {
    const s = store.sent[k], v = server.answers[k];
    if (server.phase === 'preview' || (v != null && (String(v) === String(s.value) || s.value === 'auto')) || Date.now() - s.at > 600000) delete store.sent[k];
  }
  for (const k of Object.keys(store.draft)) if (String(server.answers[k]) === String(store.draft[k])) delete store.draft[k];
  if (store.quelleWait && !blank(server.answers.quelle)) delete store.quelleWait;
  // a light world picked before the clip turned out to be a video: open again
  const isLight = (v) => !!(WORLDS[String(v || '').toLowerCase()] || {}).light;
  const save = () => { try { localStorage.setItem(storeKey, JSON.stringify(store)); } catch (e) {} };
  save();

  function value(k) {
    if (k in store.draft) return store.draft[k];
    if (k in store.sent) return store.sent[k].value;
    return server.answers[k];
  }
  const built = () => !!server.project && server.phase !== 'setup';
  // what a build applies; where it goes (posten) waits in the page until the posting
  const APPLIED = ['welt', 'format', 'titel', 'sprecher', 'farben', 'abspann'];
  const dirty = () => (built() ? APPLIED : LOCAL).filter((k) => k in store.draft);
  const waiting = () => blank(value('quelle')) && !!store.quelleWait;
  const nextOpen = (after) => {
    const from = after ? KEYS.indexOf(after) + 1 : 0;
    const order = [...KEYS.slice(from), ...KEYS.slice(0, from)];
    return order.find((k) => blank(value(k)) && !(k === 'quelle' && waiting())) || null;
  };
  let open = KEYS.includes(store.open) || store.open === null ? store.open : undefined;
  if (open === undefined) open = built() ? null : nextOpen();
  function setOpen(k) { open = k; store.open = k; save(); render(); }

  // the speakers, as A, B, … with their names: from the names given, else as many as the agent found
  function speakerNames() {
    const v = value('sprecher'), given = v && !isNone(v) && !isLater(v) ? String(v).split(/\s*,\s*/).filter(Boolean) : [];
    const n = Math.max(given.length, Number(server.speakers) || 0, given.length ? 0 : 2);
    return Object.fromEntries(Array.from({ length: n }, (_, i) => [String.fromCharCode(65 + i), given[i] || t('Stimme ', 'Voice ') + String.fromCharCode(65 + i)]));
  }
  // an answer taken while its step stays open (several picks in one step)
  function keepAnswer(k, v) { store.draft[k] = v; save(); render(); }
  function setAnswer(k, v) {
    store.draft[k] = v;
    if (String(server.answers[k]) === String(v) && !(k in store.sent)) delete store.draft[k];
    setOpen(built() ? null : nextOpen(k));
  }

  // ---------------------------------------------------------------- pchat
  // Where the chat's artifacts are: /chat/<id>/artifacts/ (pchat 0.2, a folder per chat, the
  // chat id goes with every command), /artifacts/ before.
  const chatId = (location.pathname.match(/^\/chat\/([0-9a-f-]{36})\/artifacts\//) || [])[1] || null;
  const ARTIFACTS = (chatId ? '/chat/' + chatId : '') + '/artifacts/';
  const actionState = (path) => (chatId ? '/chat/' + chatId + '/actions/' : '/api/actions/') + path;
  // pchat's command endpoint (same origin, the token cookie): a text goes
  // into the open chat as the person's message; an artifact opens or
  // renders as from pchat's own buttons.
  // data as transit: maps with keyword keys, strings escaped where transit would read a tag
  function transit(v) {
    if (Array.isArray(v)) return v.map(transit);
    if (v && typeof v === 'object') return ["^ ", ...Object.entries(v).flatMap(([k, x]) => ['~:' + k, transit(x)])];
    return typeof v === 'string' && /^[~^`]/.test(v) ? '~' + v : v;
  }
  function command(kind, data) {
    return fetch('/command', {
      method: 'POST', headers: { 'Content-Type': 'application/transit+json' },
      body: JSON.stringify(["^ ", "~:command/kind", "~:" + kind, "~:command/data", transit(chatId ? Object.assign({ id: chatId }, data) : data)])
    }).then((r) => r.json()).then((answer) => {
      const ok = Array.isArray(answer) && answer[answer.indexOf('~:success?') + 1] === true;
      // a rejection says why in its one plain string
      if (!ok) throw new Error((Array.isArray(answer) && answer.find((x) => typeof x === 'string' && !/^[~^]/.test(x))) || JSON.stringify(answer));
    });
  }
  const statusEl = document.getElementById('status');
  function say(text, error) { statusEl.className = error ? 'error' : ''; statusEl.textContent = text || ''; }
  function send(text, then) {
    clickedAt = Date.now(); sawWork = false; setBusy(true);
    return command('chat/send', { text }).then(() => { say(''); if (then) then(); })
      .catch((e) => { setBusy(false); say(t('Nicht gesendet: ', 'Not sent: ') + e.message, true); });
  }

  // busy while the agent works or a video renders (pchat's GET /api/setup
  // answers "idle": false); choosing stays free, only sending waits
  let busy = false, clickedAt = 0, sawWork = false, applying = false;
  function setBusy(on) {
    if (busy === on) return;
    busy = on;
    document.body.classList.toggle('busy', on);
    document.querySelectorAll('[data-sends]').forEach((b) => { b.disabled = on; });
    if (!on) checkVideo();
  }
  function poll() {
    fetch('/api/setup', { cache: 'no-store' }).then((r) => r.json()).then((s) => {
      if (s.idle === false) { sawWork = true; setBusy(true); }
      else if (busy && !applying && (sawWork || Date.now() - clickedAt > 8000)) setBusy(false);

    if (!server.project) return;
    fetch(ARTIFACTS + server.project + '.mp4', { headers: { Range: 'bytes=0-0' }, cache: 'no-store' })
      .then((r) => { if (r.ok !== videoReady) { videoReady = r.ok; renderActions(); } }).catch(() => {});
  }
  function startRender() {
    clickedAt = Date.now(); sawWork = false; setBusy(true);
    document.getElementById('busy-text').textContent = t('Das Video wird gerendert … ein paar Minuten.', 'The video is rendering … a few minutes.');
    command('artifacts/render', { path: server.project }).catch((e) => { setBusy(false); say(e.message, true); });
  }
  // The changes into the short without the agent: the skill's "apply" action (actions.json,
  // tools/apply.mjs) builds and checks it with them; pchat runs it and tells the agent.
  function settingsOf(keys) {
    const s = {};
    for (const k of keys) {
      const v = value(k);
      if (k === 'welt') s.world = v === 'auto' ? 'auto' : String(v).toLowerCase();
      if (k === 'format') s.aspect = v;
      if (k === 'titel') { const [a, b] = isNone(v) ? ['', ''] : String(v).split(/\s*·\s*/); s.title = a || ''; s.subtitle = b || ''; }
      if (k === 'sprecher' && !isLater(v)) s.names = isNone(v) ? '' : String(v).split(/\s*,\s*/).filter(Boolean).map((n, i) => `${String.fromCharCode(65 + i)}=${n.replace(/[=,]/g, ' ')}`).join(',');
      if (k === 'farben') s.colors = v === 'auto' ? '' : joinColors(parseColors(v));
      if (k === 'abspann') {
        const parts = isNone(v) ? [] : String(v).split(/\s*·\s*/), h = parts.find((x) => x.startsWith('@')) || '';
        s.cta = parts.filter((x) => x !== h).join(' · '); s.handle = h;
      }
    }
    return s;
  }
  function applyChanges(thenRender) {
    const keys = dirty();
    clickedAt = Date.now(); applying = true; setBusy(true);
    document.getElementById('busy-text').textContent = t('Deine Änderungen werden eingebaut …', 'Building your changes in …');
    command('artifacts/action', { path: server.project, action: 'apply', input: { settings: settingsOf(keys) } })
      .then(() => { store.applying = { at: Date.now(), keys, render: !!thenRender }; save(); watchApply(); })
      .catch((e) => { applying = false; setBusy(false); say(e.message, true); });
  }
  // the action's state until it ends (also after a reload of the page while it runs)
  function watchApply() {
    const a = store.applying;
    if (!a || !server.project) return;
    if (Date.now() - a.at > 15 * 60000) { delete store.applying; save(); return; }
    applying = true; setBusy(true);
    fetch(actionState(server.project), { cache: 'no-store' }).then((r) => r.json()).then((st) => {
      if (st.running || !st.started || st.started < a.at - 5000) {
        if (st.progress) document.getElementById('busy-text').textContent =
          st.progress === 'checking' ? t('Wird geprüft …', 'Checking …') : t('Deine Änderungen werden eingebaut …', 'Building your changes in …');
        return setTimeout(watchApply, 1000);
      }
      delete store.applying; applying = false;
      if (st.error) { save(); setBusy(false); say(t('Nicht übernommen: ', 'Not applied: ') + st.error, true); return; }
      for (const k of a.keys) delete store.draft[k];
      save();
      say(st.result && st.result.errors ? t(`Übernommen, die Prüfung fand ${st.result.errors} Fehler; der Agent kann sie beheben.`, `Applied; the check found ${st.result.errors} errors, the agent can fix them.`) : '');
      loadBuilt().then(() => {
        setBusy(false); videoReady = false; render();
        if (a.render) startRender();
      });
    }).catch(() => setTimeout(watchApply, 2000));
  }
  function renderActions() {
    const box = document.getElementById('actions');
    box.replaceChildren();
    if (!built()) return;
    const p = value('posten'), posting = p && p !== 'download' && !isNone(p);
    const later = dirty().filter((k) => !isLive(k));
    if (later.length) {
      // the preview cannot show these yet: built in first
      box.append(sendButton(t('Vorschau aktualisieren', 'Update the preview'), () => applyChanges(false), 'primary'));
    } else if (dirty().length) {
      // the preview shows them already; the render needs them in the files: built in, then rendered
      box.append(sendButton(t('Video rendern', 'Render the video'), () => applyChanges(true), 'primary'));
    } else if (videoReady) {
      box.append(el('a', { class: 'button primary', href: ARTIFACTS + server.project + '.mp4', download: server.project + '.mp4' }, t('Herunterladen', 'Download')),
        el('button', { onclick: () => command('artifacts/open', { path: server.project + '.mp4' }) }, t('Video ansehen', 'Watch the video')));
      if (posting) box.append(sendButton(t('Jetzt posten', 'Post it now'), () => send(t('Das Video ist gut, bitte posten auf: ', 'The video is good, please post to: ') + p)));
    } else {
      box.append(sendButton(t('Video rendern', 'Render the video'), startRender, 'primary'),
        el('button', { onclick: () => command('artifacts/open', { path: server.project }) }, t('Groß ansehen', 'Watch it big')));
    }
  }

  function render() {
    const answered = LOCAL.filter((k) => !blank(value(k))).length + (blank(value('quelle')) && !store.quelleWait ? 0 : 1);
    document.getElementById('title').textContent = t('Dein Kinetic Short', 'Your kinetic short');
    document.getElementById('sub').textContent = built()
      ? t('Die Vorschau ist gebaut. Was du änderst, zeigt sie sofort.', 'The preview is built. What you change shows in it at once.')
      : t(`${answered} von ${KEYS.length} eingestellt · Wähle in beliebiger Reihenfolge, ändern geht jederzeit.`, `${answered} of ${KEYS.length} set · Any order, change anything any time.`);
    document.getElementById('caption').textContent = built() ? (dirty().some(isLive) ? t('Vorschau mit deinen Änderungen', 'Preview with your changes') : t('Vorschau, noch nicht gerendert', 'Preview, not rendered yet')) : t('Angedeutet, bis die Vorschau gebaut ist', 'A hint until the preview is built');
    renderPreview();
    renderSteps();
    renderFinish();
    renderActions();
    if (built()) pushLive();
  }

  document.getElementById('busy-text').textContent = server.note ? server.note + ' …'
    : server.phase === 'building' ? t('Die Vorschau wird gebaut … ein, zwei Minuten.', 'Building the preview … a minute or two.')
    : t('Der Agent arbeitet … Du kannst hier weiter einstellen.', 'The agent is working … you can go on setting things here.');
  render();
  poll();
  checkVideo();
  loadBuilt().then(render);
  watchApply();
</script>
</body>
</html>
